  <rect x="104" y="340" width="2" height="26" fill="rgba(0,0,0,0.1)"/>

  <rect x="118" y="344" width="60" height="10" rx="4" fill="rgba(0,0,0,0.06)"/>
  <rect x="183" y="344" width="46" height="10" rx="4" fill="rgba(74,56,245,0.14)"/>
  <text x="206" y="352" font-family="sans-serif" font-size="9" fill="#4a38f5" text-anchor="middle" font-weight="700">half</text>
  <rect x="234" y="344" width="90" height="10" rx="4" fill="rgba(0,0,0,0.06)"/>
  <rect x="329" y="344" width="52" height="10" rx="4" fill="rgba(74,56,245,0.14)"/>
  <text x="355" y="352" font-family="sans-serif" font-size="9" fill="#4a38f5" text-anchor="middle" font-weight="700">wave</text>
