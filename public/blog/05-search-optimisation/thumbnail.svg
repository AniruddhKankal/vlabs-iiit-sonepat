    <text x="314" y="495" font-family="sans-serif" font-size="8" fill="rgba(0,0,0,0.32)">Bridge</text>
  </g>

  <g>
    <rect x="416" y="466" width="150" height="46" rx="8" fill="#f7f6f3" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <g fill="rgba(0,0,0,0.18)">
      <circle cx="430" cy="478" r="1.1"/><circle cx="438" cy="478" r="1.1"/><circle cx="446" cy="478" r="1.1"/><circle cx="454" cy="478" r="1.1"/><circle cx="462" cy="478" r="1.1"/>
      <circle cx="430" cy="486" r="1.1"/><circle cx="438" cy="486" r="1.1"/><circle cx="446" cy="486" r="1.1"/><circle cx="454" cy="486" r="1.1"/><circle cx="462" cy="486" r="1.1"/>
      <circle cx="430" cy="494" r="1.1"/><circle cx="438" cy="494" r="1.1"/><circle cx="446" cy="494" r="1.1"/><circle cx="454" cy="494" r="1.1"/><circle cx="462" cy="494" r="1.1"/>
    </g>
    <text x="476" y="483" font-family="sans-serif" font-size="9" fill="rgba(0,0,0,0.5)" font-weight="600">Half Adder</text>
    <text x="476" y="495" font-family="sans-serif" font-size="8" fill="rgba(0,0,0,0.32)">Logic</text>
  </g>

  <!-- Bottom label -->
  <text x="600" y="598" font-family="sans-serif" font-size="12" fill="rgba(0,0,0,0.25)" text-anchor="middle" letter-spacing="2">VLABS · SEARCH, REBUILT</text>
</svg>
