  <text x="687" y="149" font-family="monospace" font-size="13" fill="rgba(0,0,0,0.4)" text-anchor="middle">⌘</text>
  <rect x="708" y="130" width="28" height="28" rx="6" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <text x="722" y="149" font-family="monospace" font-size="13" fill="rgba(0,0,0,0.4)" text-anchor="middle">K</text>

