  <text x="104" y="399" font-family="sans-serif" font-size="10" fill="rgba(0,0,0,0.28)">Semester 1 › Analog Electronics › Full-Wave Bridge Rectifier</text>
  <rect x="104" y="407" width="140" height="9" rx="3" fill="rgba(0,0,0,0.05)"/>
  <rect x="250" y="407" width="40" height="9" rx="3" fill="rgba(74,56,245,0.12)"/>

