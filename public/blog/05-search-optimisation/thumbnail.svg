    <g fill="rgba(0,0,0,0.18)">
      <circle cx="106" cy="478" r="1.1"/><circle cx="114" cy="478" r="1.1"/><circle cx="122" cy="478" r="1.1"/><circle cx="130" cy="478" r="1.1"/><circle cx="138" cy="478" r="1.1"/>
      <circle cx="106" cy="486" r="1.1"/><circle cx="114" cy="486" r="1.1"/><circle cx="122" cy="486" r="1.1"/><circle cx="130" cy="486" r="1.1"/><circle cx="138" cy="486" r="1.1"/>
      <circle cx="106" cy="494" r="1.1"/><circle cx="114" cy="494" r="1.1"/><circle cx="122" cy="494" r="1.1"/><circle cx="130" cy="494" r="1.1"/><circle cx="138" cy="494" r="1.1"/>
    </g>
    <text x="152" y="483" font-family="sans-serif" font-size="9" fill="rgba(0,0,0,0.5)" font-weight="600">Half-Wave</text>
    <text x="152" y="495" font-family="sans-serif" font-size="8" fill="rgba(0,0,0,0.32)">Rectifier</text>
  </g>

  <g>
    <rect x="254" y="466" width="150" height="46" rx="8" fill="#f7f6f3" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <g fill="rgba(0,0,0,0.18)">
      <circle cx="268" cy="478" r="1.1"/><circle cx="276" cy="478" r="1.1"/><circle cx="284" cy="478" r="1.1"/><circle cx="292" cy="478" r="1.1"/><circle cx="300" cy="478" r="1.1"/>
      <circle cx="268" cy="486" r="1.1"/><circle cx="276" cy="486" r="1.1"/><circle cx="284" cy="486" r="1.1"/><circle cx="292" cy="486" r="1.1"/><circle cx="300" cy="486" r="1.1"/>
      <circle cx="268" cy="494" r="1.1"/><circle cx="276" cy="494" r="1.1"/><circle cx="284" cy="494" r="1.1"/><circle cx="292" cy="494" r="1.1"/><circle cx="300" cy="494" r="1.1"/>
