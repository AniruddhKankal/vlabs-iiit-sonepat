<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6f4"/>
      <stop offset="100%" stop-color="#eeecea"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a38f5"/>
      <stop offset="100%" stop-color="#6c5ff7"/>
    </linearGradient>
    <linearGradient id="dark-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow-card">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-row">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4a38f5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background + grid -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- ── Dark architecture panel, peeking out behind the main card ── -->
  <g filter="url(#shadow-card)">
    <rect x="660" y="120" width="470" height="400" rx="16" fill="url(#dark-panel)"/>
  </g>

  <text x="780" y="162" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="2" font-weight="500">BUILD TIME</text>
  <line x1="780" y1="176" x2="1090" y2="176" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Pipeline, drawn inside the dark panel — single column, clear of the white card -->
  <g font-family="monospace" font-size="11">
    <rect x="780" y="202" width="310" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="935" y="223" fill="rgba(255,255,255,0.55)" text-anchor="middle">SEMESTER_CONTENTS</text>
    <text x="935" y="256" fill="rgba(255,255,255,0.25)" text-anchor="middle">↓</text>

    <rect x="780" y="264" width="310" height="34" rx="8" fill="rgba(74,56,245,0.18)" stroke="rgba(74,56,245,0.4)" stroke-width="1"/>
    <text x="935" y="285" fill="#a79bf8" text-anchor="middle">buildSearchIndex()</text>
    <text x="935" y="318" fill="rgba(255,255,255,0.25)" text-anchor="middle">↓</text>

    <rect x="780" y="326" width="310" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="935" y="347" fill="rgba(255,255,255,0.55)" text-anchor="middle">search-index.output.ts</text>
    <text x="935" y="380" fill="rgba(255,255,255,0.25)" text-anchor="middle">↓</text>

    <rect x="780" y="388" width="310" height="34" rx="8" fill="url(#accent)"/>
    <text x="935" y="409" fill="white" text-anchor="middle" font-weight="600">browser (flat array only)</text>
  </g>

  <text x="935" y="456" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.22)" text-anchor="middle" letter-spacing="0.5">normalize() · matchesAllTokens()</text>
  <text x="935" y="476" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.22)" text-anchor="middle" letter-spacing="0.5">buildHighlightRegex()</text>

